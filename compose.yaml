services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: elevator-go-backend:latest
    container_name: elevator-go-backend
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      TICK_INTERVAL_MS: "1000"
      FLOOR_MIN: "1"
      FLOOR_MAX: "10"
      ELEVATOR_COUNT: "2"
      LOG_FORMAT: "json"
      # frontend オリジンをここで許可。複数なら "," 区切り、全許可なら "*"。
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # ブラウザから直接叩く backend オリジン。compose 越しでなく host から見える URL を渡す。
        VITE_API_BASE: "http://localhost:8080"
    image: elevator-go-frontend:latest
    container_name: elevator-go-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
