server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: 静的アセット以外は index.html にフォールバック
  location / {
    try_files $uri $uri/ /index.html;
  }

  # gzip 圧縮
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;
}
